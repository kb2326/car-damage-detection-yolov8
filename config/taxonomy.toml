# Canonical label sets. Class order is the YOLO class index: only ever append new classes.
version = "taxonomy-v1"

[damage]
classes = ["crack", "dent", "glass_shatter", "lamp_broken", "scratch", "tire_flat"]
# Present in the legacy course subset only, with too few examples to train.
ignore = ["smash"]

[parts]
classes = [
  "back_bumper", "back_door", "back_glass", "back_left_door", "back_left_light", "back_light",
  "back_right_door", "back_right_light", "front_bumper", "front_door", "front_glass",
  "front_left_door", "front_left_light", "front_light", "front_right_door", "front_right_light",
  "hood", "left_mirror", "right_mirror", "tailgate", "trunk", "wheel",
]
# Catch-all class with no consistent meaning.
ignore = ["object"]

[part_groups]
# Coarse groups for damage-to-part fusion and pricing. Zero-shot models cannot reliably tell
# left from right, and pricing does not need it. Every parts class belongs to exactly one group.
classes = ["front_bumper", "rear_bumper", "door", "hood", "trunk", "light", "glass", "mirror", "wheel"]

[part_groups.members]
front_bumper = ["front_bumper"]
rear_bumper = ["back_bumper"]
door = ["back_door", "back_left_door", "back_right_door", "front_door", "front_left_door", "front_right_door"]
hood = ["hood"]
trunk = ["tailgate", "trunk"]
light = ["back_left_light", "back_light", "back_right_light", "front_left_light", "front_light", "front_right_light"]
glass = ["back_glass", "front_glass"]
mirror = ["left_mirror", "right_mirror"]
wheel = ["wheel"]

[part_groups.damage_parts]
# A damage type can only be fused to these groups; unlisted types (dent, scratch, crack, smash)
# can be on any part. Stops impossible pairs such as a flat tyre "on the front bumper".
tire_flat = ["wheel"]
lamp_broken = ["light"]
glass_shatter = ["glass", "light", "mirror"]
