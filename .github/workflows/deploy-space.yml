name: Deploy showcase to Hugging Face

# The read-only showcase (ADR 0020). Runs by hand or on a published release, never on pull requests.
# Needs the repository secret HF_TOKEN (a Hugging Face write token) and the repository variable
# HF_SPACE (for example "your-name/claimlens").
on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install the web app (it renders the static pages)
        run: uv sync --locked --group web --group agent
      - name: Deploy
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: uv run --with "huggingface_hub==0.35.3" python scripts/deploy_space.py "$HF_SPACE"
