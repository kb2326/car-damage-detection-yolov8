name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked --group training --group knowledge --group agent --group tracing --group web
      - name: Lint
        run: uv run ruff check .
      - name: Format check
        run: uv run ruff format --check .
      # Red-team RT-19 (OWASP ASI04, supply chain): every locked dependency, every group.
      # Ignored, with reason: PYSEC-2026-2447 (diskcache pickle cache, no fixed release yet) comes
      # only through DVC, a developer tool the app never imports; exploiting it needs write access
      # to the local cache folder. Remove the ignore when diskcache ships a fix.
      - name: Dependency audit
        run: |
          uv export --frozen --no-hashes --format requirements-txt --all-groups --no-emit-project > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit -r "$RUNNER_TEMP/requirements.txt" --disable-pip --no-deps --progress-spinner off --ignore-vuln PYSEC-2026-2447
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Eval gate (committed scorecard vs baseline)
        run: uv run claimlens eval-gate
