[project]
name = "claimlens"
version = "0.1.0"
description = "AI-assisted vehicle damage claims triage: custom CV models as tools for an auditable adjuster agent."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic>=1.11,<2",
  "imagehash>=4.3",
  "mcp>=2.2,<3",
  "numpy>=2.0",
  "pillow>=11.0",
  "pydantic>=2.8",
  "pyyaml>=6.0",
]

[project.scripts]
claimlens = "claimlens.cli:main"

[dependency-groups]
dev = [
  "dvc>=3.50",
  "mypy>=1.11",
  "opencv-python-headless>=4.9",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]
vision = [
  "onnx>=1.16",
  "onnxruntime>=1.20",
  "ultralytics>=8.3,<9",
]
autolabel = [
  "opencv-python-headless>=4.9",
  "torch>=2.4",
  "torchvision>=0.19",
  "transformers>=5.0",
]
review = [
  "fiftyone>=1.0",
]
agent = [
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
]
tracing = [
  "openinference-instrumentation-langchain>=0.1.78",
  "opentelemetry-exporter-otlp-proto-http>=1.45",
  "opentelemetry-sdk>=1.45",
]
knowledge = [
  "fastembed>=0.8,<0.9",
  "lancedb>=0.39,<0.40",
]
training = [
  "mlflow>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimlens"]

# ---------- Ruff (lint + format) ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["legacy", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PT"]

# ---------- Mypy (strict on our package) ----------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["ultralytics", "ultralytics.*", "imagehash", "imagehash.*", "mlflow", "mlflow.*", "lancedb", "lancedb.*", "fastembed", "fastembed.*", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["cv2", "cv2.*", "torch", "torch.*", "transformers", "transformers.*", "fiftyone", "fiftyone.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
omit = [
  "*/claimlens/vision/legacy_yolo.py",
  "*/claimlens/autolabel/grounded_sam.py",
  "*/claimlens/review/fiftyone_app.py",
  "*/claimlens/training/ultralytics_trainer.py",
  "*/claimlens/vision/yolo_seg.py",
  "*/claimlens/vision/ultralytics_segmenter.py",
  "*/claimlens/llm/anthropic_provider.py",
  "*/claimlens/knowledge/fastembedder.py",
]

# ---------- Pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=claimlens --cov-report=term-missing"
markers = [
  "slow: long-running tests (model inference, training)",
  "integration: tests that touch external services",
]

[tool.coverage.report]
fail_under = 85
