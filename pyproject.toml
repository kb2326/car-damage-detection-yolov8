[project]
name = "claimlens"
version = "0.1.0"
description = "AI-assisted vehicle damage claims triage: custom CV models as tools for an auditable adjuster agent."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pre-commit>=3.8",
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimlens"]

# ---------- Ruff (lint + format) ----------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["legacy", "data", "models"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PT"]

# ---------- Mypy (strict on our package) ----------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

# ---------- Pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=claimlens --cov-report=term-missing"
markers = [
  "slow: long-running tests (model inference, training)",
  "integration: tests that touch external services",
]
