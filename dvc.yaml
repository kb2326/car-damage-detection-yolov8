stages:
  build-damage-v1:
    cmd: uv run claimlens data build damage-v1
    deps:
      - data/raw/cardd-roboflow-v6
      - data/raw/legacy-course-subset
      - evals/golden/v1/claims.jsonl
      - config/datasets.toml
      - config/taxonomy.toml
      - src/claimlens/data
    outs:
      - data/interim/damage-v1
      - data/processed/damage-v1
      - reports/data/damage-v1-validation.json:
          cache: false
      - reports/data/damage-v1-stats.md:
          cache: false
    metrics:
      - reports/data/damage-v1-stats.json:
          cache: false
  build-parts-v1:
    cmd: uv run claimlens data build parts-v1
    deps:
      - data/raw/carparts-seg
      - config/datasets.toml
      - config/taxonomy.toml
      - src/claimlens/data
    outs:
      - data/interim/parts-v1
      - data/processed/parts-v1
      - reports/data/parts-v1-validation.json:
          cache: false
      - reports/data/parts-v1-stats.md:
          cache: false
    metrics:
      - reports/data/parts-v1-stats.json:
          cache: false
  # Frozen: runs on a Kaggle GPU (training/kaggle/autolabel), never by `dvc repro` on a laptop.
  # To refresh: run the Kaggle job, copy its outputs here, then `dvc commit -f autolabel-fusion-eval-v1`.
  autolabel-fusion-eval-v1:
    frozen: true
    cmd: uv run --group autolabel claimlens data autolabel fusion-eval-v1
    deps:
      - data/raw/cardd-roboflow-v6
      - data/interim/damage-v1
      - config/autolabel.toml
      - config/taxonomy.toml
      - src/claimlens/autolabel
    outs:
      - data/interim/fusion-eval-v1
    metrics:
      - reports/data/fusion-eval-v1-autolabel.json:
          cache: false
  build-fusion-eval-v1:
    cmd: uv run claimlens review apply parts --job fusion-eval-v1
    deps:
      - data/interim/fusion-eval-v1
      - reviews/fusion-eval-v1.json
      - src/claimlens/review/decisions.py
      - src/claimlens/data/records.py
      - src/claimlens/cli.py
    outs:
      - data/processed/fusion-eval-v1
    metrics:
      - reports/data/fusion-eval-v1-review.json:
          cache: false
