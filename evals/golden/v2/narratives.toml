# Narrative cases for golden claims v2 (spec docs/specs/2026-10-02-m5b-agent-evaluation-design.md).
# Written by Claude from the fictional policy wordings; not yet reviewed by a person.
# Every policy used here is active with collision cover, so only the story decides the route.
# photo_kind picks a photo whose damage fits the story (see scripts/make_golden_v2.py): only the
# story_mismatch cases mismatch on purpose.
# Wordings: P-1001, P-1002, P-1005 standard (STD); P-1003, P-1006 premium (PRM); P-1004 basic (BAS).

